controller_manager:
  ros__parameters:
    update_rate: 500

    mujoco_sim_controller:
      type: lqr_controller/MujocoSimController

    lqr_controller:
      type: lqr_controller/LQRController

mujoco_sim_controller:
  ros__parameters:
    use_sim_time: true
    effort_limit: 20.0

lqr_controller:
  ros__parameters:
    use_sim_time: true
    imu_topic: /imu_imu_sensor/imu
